# Renovate #1688 proof (reddoorla/reddoor-maintenance#1688, reddoor-workspace briefs/2026-10-24-renovate-follow-up-1688.md).
# Never merge this PR. dry-* arms write nothing; the other arms write only under probe/1688-*/ as draft PRs.
name: renovate-1688-probe
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/renovate-1688-probe.yml", ".github/renovate-probe-1688/**"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        arm: [r2-majors-control, r2-majors-final, r2-slots-control, r2-slots-final]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate-probe-1688/${{ matrix.arm }}.js
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_USERNAME: "reddoor-renovate[bot]"
          RENOVATE_GIT_AUTHOR: "reddoor-renovate[bot] <312185038+reddoor-renovate[bot]@users.noreply.github.com>"
